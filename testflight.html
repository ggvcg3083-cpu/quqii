<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chill OS · TestFlight</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafafa; --main:#121212; --sub:#888; --line:#e8e8e8; --ok:#2d5a3d; --err:#8B3A33; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--main);
    font-family:'DM Sans','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    padding:32px 24px calc(env(safe-area-inset-bottom,24px) + 48px);
  }
  .card { width:100%; max-width:420px; }
  .kicker { font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:3px; text-transform:uppercase; color:var(--sub); margin-bottom:10px; }
  h1 { font-family:'Playfair Display',serif; font-style:italic; font-weight:600; font-size:2.4rem; line-height:1.05; letter-spacing:-.5px; margin-bottom:14px; }
  .lead { font-size:.85rem; line-height:1.9; color:#444; margin-bottom:34px; padding-bottom:26px; border-bottom:1px solid var(--main); }
  .lead b { color:var(--main); }
  label { display:block; font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:2.5px; text-transform:uppercase; color:var(--sub); margin-bottom:8px; }
  input {
    width:100%; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; font-family:'DM Sans','Noto Sans SC',sans-serif; font-size:.95rem;
    color:var(--main); outline:none; transition:border-color .25s; margin-bottom:22px;
  }
  input:focus { border-color:var(--main); }
  input.bad { border-color:var(--err); }
  .hp { position:absolute; left:-9999px; opacity:0; height:0; }
  button {
    width:100%; padding:15px 0; background:var(--main); color:var(--bg);
    border:none; border-radius:100px; font-family:'Space Mono',monospace;
    font-size:.75rem; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
    cursor:pointer; transition:transform .15s, opacity .2s;
  }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; }
  .msg { margin-top:16px; font-size:.8rem; line-height:1.7; min-height:1.4em; }
  .msg.ok { color:var(--ok); }
  .msg.err { color:var(--err); }
  .done { text-align:center; display:none; }
  .done .big { font-family:'Playfair Display',serif; font-style:italic; font-size:1.8rem; margin:18px 0 10px; }
  .done p { font-size:.82rem; color:#555; line-height:1.9; }
  .done .mono { font-family:'Space Mono',monospace; font-size:.62rem; letter-spacing:2px; text-transform:uppercase; color:var(--sub); margin-top:26px; }
  .foot { margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-family:'Space Mono',monospace; font-size:.55rem; letter-spacing:2px; text-transform:uppercase; color:var(--sub); display:flex; justify-content:space-between; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --main:#f0f0f0; --sub:#999; --line:#333; }
    .lead { color:#bbb; } .done p { color:#aaa; }
    input { background:#1a1a1a; color:#f0f0f0; }
  }
</style>
</head>
<body>
<div class="card">
  <div id="form-view">
    <div class="kicker">Chill OS · iOS App</div>
    <h1>TestFlight.</h1>
    <p class="lead">Chill OS 的 iOS 正式版 App 将通过 <b>TestFlight 邮箱邀请</b>发放。请在下方填写你的 <b>QQ 邮箱</b>（QQ号@qq.com），邀请邮件会发到这里，收到后在 iPhone 上点开即可安装。用其他邮箱也可以，能收到邮件就行。<b>邀请一人一份，下载后链接即失效，请勿外传。</b></p>
    <label for="email">QQ 邮箱 / Email</label>
    <input type="email" id="email" placeholder="12345678@qq.com" autocomplete="email" inputmode="email">
    <label for="nick">你在 Chill 社群的昵称（方便核对名单）</label>
    <input type="text" id="nick" placeholder="昵称" maxlength="40">
    <input type="text" id="website" class="hp" tabindex="-1" autocomplete="off">
    <button id="btn" onclick="submitForm()">提交 / Submit</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="done" id="done-view">
    <div class="kicker">Received</div>
    <div class="big">收到了。</div>
    <p>你的邮箱已登记。等 App 通过审核后，<br>TestFlight 邀请会发到你的邮箱，<br>点邮件里的按钮即可安装。<br><br>邀请链接下载后即失效，请勿外传。</p>
    <div class="mono" id="done-mail"></div>
  </div>
  <div class="foot"><span>Chill OS</span><span>Invite-only ✦</span></div>
</div>
<script>
const SB_URL = 'https://kjtvtyfibkklwsievlgt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqdHZ0eWZpYmtrbHdzaWV2bGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzE4MjgsImV4cCI6MjA5Mzc0NzgyOH0.jXFV79-PHPbu14C9LwmrNlL4cIw0HLnTc67svJC3ovA';

function validEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s); }

async function submitForm() {
  const emailEl = document.getElementById('email');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const email = emailEl.value.trim().toLowerCase();
  const nick = document.getElementById('nick').value.trim();
  if (document.getElementById('website').value) return; // 蜜罐：机器人填了就静默丢弃
  msg.className = 'msg'; msg.textContent = '';
  if (!validEmail(email)) {
    emailEl.classList.add('bad');
    msg.className = 'msg err'; msg.textContent = '邮箱格式不太对，检查一下？';
    return;
  }
  emailEl.classList.remove('bad');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch(SB_URL + '/rest/v1/testflight_signups', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ email: email, nickname: nick })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    localStorage.setItem('tf-signup-done', email);
    document.getElementById('form-view').style.display = 'none';
    const dv = document.getElementById('done-view');
    document.getElementById('done-mail').textContent = email;
    dv.style.display = 'block';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '提交失败了（' + e.message + '）。多试一次，还不行就直接把邮箱发给管理员。';
    btn.disabled = false; btn.textContent = '提交 / Submit';
  }
}
// 提交过的老用户再打开，直接显示完成态（换邮箱重新提交也行：清 localStorage 即可）
(function(){
  const done = localStorage.getItem('tf-signup-done');
  if (done) {
    document.getElementById('form-view').style.display = 'none';
    document.getElementById('done-mail').textContent = done;
    document.getElementById('done-view').style.display = 'block';
  }
})();
</script>
</body>
</html>
